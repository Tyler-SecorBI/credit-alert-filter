  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normalize(text) {
    return String(text || "")
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function stripHtml(text) {
    const div = document.createElement("div");
    div.innerHTML = String(text || "");
    return normalize(div.textContent || div.innerText || "");
  }

  function decodeHtmlEntities(text) {
    const textarea = document.createElement("textarea");
    textarea.innerHTML = String(text || "");
    return textarea.value;
  }

  function cleanEmailText(text) {
    let t = String(text || "");
    t = decodeHtmlEntities(t);
    t = t.replace(/<style[\s\S]*?<\/style>/gi, "\n");
    t = t.replace(/<script[\s\S]*?<\/script>/gi, "\n");
    t = t.replace(/<br\s*\/?>/gi, "\n");
    t = t.replace(/<\/p>/gi, "\n");
    t = t.replace(/<\/div>/gi, "\n");
    t = t.replace(/<\/tr>/gi, "\n");
    t = t.replace(/<\/table>/gi, "\n");
    t = t.replace(/<\/td>/gi, " ");
    t = stripHtml(t);

    t = t
      .split("\n")
      .map(line => line.trim())
      .filter(line => line && !GOOGLE_NOISE_PATTERNS.some(p => p.test(line)))
      .join("\n");

    return normalize(t);
  }

  // -----------------------------
  // Advanced EML parsing helpers

  function splitHeaderBody(raw) {
    const match = String(raw || "").match(/\r?\n\r?\n/);
    if (!match) return { headerText: raw, bodyText: "" };
    const idx = match.index;
    return {
      headerText: raw.slice(0, idx),
      bodyText: raw.slice(idx + match[0].length)
    };
  }

  function unfoldHeaderLines(headerText) {
    return String(headerText || "").replace(/\r?\n([ \t]+)/g, " ");
  }

  function parseHeaders(headerText) {
    const lines = unfoldHeaderLines(headerText).split(/\r?\n/);
    const headers = {};
    for (const line of lines) {
      const idx = line.indexOf(":");
      if (idx === -1) continue;
      const name = line.slice(0, idx).trim().toLowerCase();
      const value = line.slice(idx + 1).trim();
      headers[name] = value;
    }
    return headers;
  }

  function parseHeaderParams(headerValue) {
    const raw = String(headerValue || "");
    const segments = raw.split(";").map(x => x.trim());
    const main = (segments[0] || "").toLowerCase();
    const params = {};

    for (let i = 1; i < segments.length; i++) {
      const idx = segments[i].indexOf("=");
      if (idx === -1) continue;
      const key = segments[i].slice(0, idx).trim().toLowerCase();
      let val = segments[i].slice(idx + 1).trim();
      val = val.replace(/^"(.*)"$/, "$1");
      params[key] = val;
    }

    return { main, params };
  }

  function decodeMimeWords(str) {
    return String(str || "").replace(/=\?([^?]+)\?([bBqQ])\?([^?]+)\?=/g, (_, charset, enc, data) => {
      try {
        if (/^b$/i.test(enc)) {
          const binary = atob(data.replace(/\s/g, ""));
          const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
          return decodeBytes(bytes, charset);
        } else {
          let qp = data.replace(/_/g, " ");
          qp = qp.replace(/=([A-Fa-f0-9]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
          const bytes = Uint8Array.from(qp.split("").map(c => c.charCodeAt(0)));
          return decodeBytes(bytes, charset);
        }
      } catch {
        return data;
      }
    });
  }

  function normalizeCharset(charset) {
    const cs = String(charset || "").toLowerCase().trim();
    if (!cs) return "utf-8";
    if (cs === "utf8") return "utf-8";
    if (cs === "us-ascii") return "utf-8";
    if (cs === "latin1") return "iso-8859-1";
    return cs;
  }

  function decodeBytes(bytes, charset = "utf-8") {
    try {
      return new TextDecoder(normalizeCharset(charset), { fatal: false }).decode(bytes);
    } catch {
      try {
        return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
      } catch {
        return Array.from(bytes).map(b => String.fromCharCode(b)).join("");
      }
    }
  }

  function base64ToBytes(input) {
    const clean = String(input || "").replace(/\s+/g, "");
    const binary = atob(clean);
    return Uint8Array.from(binary, c => c.charCodeAt(0));
  }

  function quotedPrintableToBytes(input) {
    let str = String(input || "").replace(/=\r?\n/g, "");
    const out = [];
    for (let i = 0; i < str.length; i++) {
      if (str[i] === "=" && /[A-Fa-f0-9]{2}/.test(str.slice(i + 1, i + 3))) {
        out.push(parseInt(str.slice(i + 1, i + 3), 16));
        i += 2;
      } else {
        out.push(str.charCodeAt(i));
      }
    }
    return Uint8Array.from(out);
  }

  function decodeBodyByEncoding(bodyText, encoding, charset) {
    const enc = String(encoding || "").toLowerCase();
    try {
      if (enc.includes("base64")) {
        return decodeBytes(base64ToBytes(bodyText), charset);
      }
      if (enc.includes("quoted-printable")) {
        return decodeBytes(quotedPrintableToBytes(bodyText), charset);
      }
      const rawBytes = Uint8Array.from(String(bodyText || "").split("").map(c => c.charCodeAt(0)));
      return decodeBytes(rawBytes, charset);
    } catch {
      return String(bodyText || "");
    }
  }

  function getFilenameFromHeaders(headers) {
    const disp = parseHeaderParams(headers["content-disposition"] || "");
    const type = parseHeaderParams(headers["content-type"] || "");

    return decodeMimeWords(
      disp.params["filename*"] ||
      disp.params["filename"] ||
      type.params["name*"] ||
      type.params["name"] ||
      ""
    );
  }

  function splitMultipart(bodyText, boundary) {
    const marker = "--" + boundary;
    const endMarker = marker + "--";
    const lines = String(bodyText || "").split(/\r?\n/);
    const parts = [];
    let current = [];
    let inside = false;

    for (const line of lines) {
      if (line === marker) {
        if (inside && current.length) {
          parts.push(current.join("\n"));
          current = [];
        }
        inside = true;
        continue;
      }
      if (line === endMarker) {
        if (inside && current.length) {
          parts.push(current.join("\n"));
        }
        break;
      }
      if (inside) current.push(line);
    }
    return parts;
  }

  function parseMimeEntity(raw, options = {}) {
    const { headerText, bodyText } = splitHeaderBody(raw);
    const headers = parseHeaders(headerText);
    const subject = decodeMimeWords(headers["subject"] || "");
    const from = decodeMimeWords(headers["from"] || "");
    const date = headers["date"] || "";
    const contentType = parseHeaderParams(headers["content-type"] || "text/plain");
    const encoding = headers["content-transfer-encoding"] || "";
    const charset = contentType.params.charset || "utf-8";
    const filename = getFilenameFromHeaders(headers);

    const result = {
      headers,
      subject,
      from,
      date,
      plainParts: [],
      htmlParts: [],
      attachments: []
    };

    // Nested rfc822 message
    if (contentType.main === "message/rfc822") {
      const nested = parseMimeEntity(bodyText, { nested: true });
      result.plainParts.push(...nested.plainParts);
      result.htmlParts.push(...nested.htmlParts);
      result.attachments.push(...nested.attachments);
      return result;
    }

    // Multipart
    if (contentType.main.startsWith("multipart/")) {
      const boundary = contentType.params.boundary;
      if (!boundary) return result;
      const parts = splitMultipart(bodyText, boundary);
      parts.forEach(part => {
        const child = parseMimeEntity(part, { nested: true });
        result.plainParts.push(...child.plainParts);
        result.htmlParts.push(...child.htmlParts);
        result.attachments.push(...child.attachments);
      });
      return result;
    }

    // Leaf node
    const decoded = decodeBodyByEncoding(bodyText, encoding, charset);
    const mime = contentType.main || "text/plain";

    const isAttachment =
      !!filename ||
      /attachment/i.test(headers["content-disposition"] || "");

    if (isAttachment) {
      const att = {
        filename: filename || "attachment",
        mimeType: mime,
        text: "",
        raw: decoded
      };

      if (mime.includes("text/plain") || mime.includes("text/html")) {
        att.text = mime.includes("text/html") ? cleanEmailText(decoded) : normalize(decoded);
      } else if (/\.eml$/i.test(att.filename) || mime === "message/rfc822") {
        const nested = parseMimeEntity(decoded, { nested: true });
        att.text = cleanEmailText(
          nested.plainParts.join("\n\n") || nested.htmlParts.join("\n\n")
        );
      } else {
        att.text = normalize(decoded);
      }

      result.attachments.push(att);
      return result;
    }

    if (mime.includes("text/plain")) {
      result.plainParts.push(normalize(decoded));
      return result;
    }

    if (mime.includes("text/html")) {
      result.htmlParts.push(cleanEmailText(decoded));
      return result;
    }

    // Some weird body types still contain readable text
    if (decoded && decoded.trim()) {
      result.plainParts.push(normalize(decoded));
    }

    return result;
  }

  function parseEml(rawText, sourceName = "email.eml") {
    const parsed = parseMimeEntity(rawText, { root: true });

    const subject = parsed.subject || sourceName || "Untitled email";
    const from = parsed.from || "EML message";
    const date = parsed.date || "";

    const body = cleanEmailText(
      parsed.plainParts.join("\n\n") || parsed.htmlParts.join("\n\n")
    );

    const chunks = [];

    if (body) {
      chunks.push({
        sourceType: "eml-body",
        sourceName,
        title: subject,
        source: from,
        metaDate: date,
        text: body,
        url: ""
      });
    }

    parsed.attachments.forEach(att => {
      if (att.text && att.text.trim()) {
        chunks.push({
          sourceType: "eml-attachment",
          sourceName: att.filename,
          title: att.filename + " (" + subject + ")",
          source: "EML attachment",
          metaDate: date,
          text: att.text.trim(),
          url: ""
        });
      }
    });

    return {
      subject,
      from,
      date,
      body,
      attachments: parsed.attachments,
      chunks
    };
  }

  // -----------------------------
  // General helpers
  // -----------------------------
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function termRegex(term) {
    const escaped = escapeRegExp(String(term).trim());
    return new RegExp("(^|[^a-zA-Z0-9])" + escaped + "([^a-zA-Z0-9]|$)", "i");
  }

  function extractUrls(text) {
    return String(text || "").match(/https?:\/\/[^\s)\]}"']+/g) || [];
  }

  function domainFromUrl(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch {
      return "";
    }
  }

  function excerpt(text, n) {
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    if (clean.length <= n) return clean;
    return clean.slice(0, n).replace(/\s+\S*$/, "") + "...";
  }

  function detectEntities(text, watchlistText) {
    const lower = String(text || "").toLowerCase();
    const entities = [];

    String(watchlistText || "")
      .split(/\n|,|;/)
      .map(x => x.trim())
      .filter(Boolean)
      .forEach(entity => {
        if (lower.includes(entity.toLowerCase())) entities.push(entity);
      });

    const patterns = [
      /\bCity of [A-Z][A-Za-z .'-]+/g,
      /\bTown of [A-Z][A-Za-z .'-]+/g,
      /\b[A-Z][A-Za-z .'-]+ County\b/g,
      /\b[A-Z][A-Za-z .'-]+ School District\b/g,
      /\b[A-Z][A-Za-z .'-]+ Water Authority\b/g,
      /\b[A-Z][A-Za-z .'-]+ Utility District\b/g,
      /\b[A-Z][A-Za-z .'-]+ Hospital\b/g,
      /\bGroup 1 Automotive\b/gi,
      /\bLithia UK\b/gi
    ];

    patterns.forEach(p => {
      const matches = String(text || "").match(p) || [];
      matches.forEach(x => entities.push(x.trim().replace(/[.,;:]$/, "")));
    });

    return Array.from(new Set(entities.map(x => x.trim())));
  }

  function extractGoogleAlertArticles(rawText, fallbackMeta = {}) {
    const text = cleanEmailText(rawText);
    const articles = [];

    // Pattern 1: markdown style URL
    const linkRegex = /\[([^\]]+?)\]\((https?:\/\/[^\s)]+)\)/g;
    const matches = Array.from(text.matchAll(linkRegex));

    if (matches.length) {
      for (let i = 0; i < matches.length; i++) {
        const current = matches[i];
        const next = matches[i + 1];

        const title = current[1].trim();
        const url = current[2].trim();

        const start = current.index + current[0].length;
        const end = next ? next.index : text.length;
        const between = text.slice(start, end).trim();

        const lines = between.split("\n").map(x => x.trim()).filter(Boolean);
        const source = lines[0] || fallbackMeta.source || "";
        const snippet = lines.slice(1).join(" ").trim();

        articles.push({
          kind: "article",
          title: title.replace(/\s+-\s+(Facebook|Twitter)\s*$/i, "").trim(),
          source,
          snippet,
          url,
          raw: [title, source, snippet, url].filter(Boolean).join("\n"),
          rawMeta: fallbackMeta
        });
      }
    }

    // Pattern 2: plain URL-led blocks
    if (!articles.length) {
      const blocks = text.split(/\n\s*\n/).map(x => x.trim()).filter(x => x.length > 50);

      blocks.forEach(block => {
        const urls = extractUrls(block);
        if (!urls.length) return;

        const lines = block.split("\n").map(x => x.trim()).filter(Boolean);
        const title = lines[0] || fallbackMeta.title || "Untitled article";
        const source = lines[1] || fallbackMeta.source || "";
        const snippet = lines.slice(2).join(" ");

        articles.push({
          kind: "article",
          title,
          source,
          snippet,
          url: urls[0],
          raw: block,
          rawMeta: fallbackMeta
        });
      });
    }

    return articles.filter(a => a.title && (a.url || a.raw));
  }

  function looksLikeGoogleAlertText(text) {
    const t = String(text || "");
    return /\[([^\]]+?)\]\((https?:\/\/[^\s)]+)\)/.test(t) ||
           /(google alert|see more results|manage your alerts)/i.test(t) ||
           (extractUrls(t).length >= 2);
  }

  function buildAnalysisItems(chunks) {
    const items = [];

    chunks.forEach(chunk => {
      const text = chunk.text || "";

      if (looksLikeGoogleAlertText(text)) {
        const found = extractGoogleAlertArticles(text, {
          source: chunk.source || "",
          title: chunk.title || "",
          url: chunk.url || "",
          sourceName: chunk.sourceName || ""
        });

        if (found.length) {
          items.push(...found);
          return;
        }
      }

      const cleaned = cleanEmailText(text);
      if (cleaned) {
        items.push({
          kind: "document",
          title: chunk.title || chunk.sourceName || "Imported document",
          source: chunk.source || chunk.sourceName || "Imported source",
          snippet: excerpt(cleaned, 700),
          url: chunk.url || "",
          raw: cleaned,
          rawMeta: chunk
        });
      }
    });

    return items;
  }

  function isLowValueArticle(article) {
    const combined = [article.title, article.source, article.snippet, article.raw].join(" ").toLowerCase();

    if (GOOGLE_NOISE_PATTERNS.some(p => p.test(combined))) return true;
    if (LOW_VALUE_PATTERNS.some(p => p.test(combined))) return true;

    if (article.kind === "article") {
      if (SOURCE_NOISE_PATTERNS.some(p => p.test(article.source)) || SOURCE_NOISE_PATTERNS.some(p => p.test(article.url))) {
        const hasRealCreditSignal =
          /(lawsuit|investigation|fraud|subpoena|default|bankruptcy|liquidity|downgrade|layoffs|closure|asset sale|divestiture|acquisition|debt|refinancing|credit facility|ftc|doj|sec)/i
            .test(combined);
        if (!hasRealCreditSignal) return true;
      }
    }

    return false;
  }

  function scoreArticle(article, watchlistText) {
    const text = [article.title, article.source, article.snippet, article.raw].join(" ");
    let score = 0;
    const categories = [];
    const matches = {};

    Object.keys(KEYWORD_LIBRARY).forEach(category => {
      const config = KEYWORD_LIBRARY[category];
      const hits = [];
      config.terms.forEach(term => {
        if (termRegex(term).test(text)) hits.push(term);
      });

      if (hits.length) {
        categories.push(category);
        matches[category] = Array.from(new Set(hits));
        score += Number(config.severity || 5) + Math.min(hits.length, 6);
      }
    });

    const domain = article.url ? domainFromUrl(article.url) : "";
    let sourceLabel = article.source || domain || "Standard source";

    SOURCE_WEIGHTS.forEach(src => {
      if (src.pattern.test(domain) || src.pattern.test(article.source) || src.pattern.test(text)) {
        score += src.boost;
        sourceLabel = src.label;
      }
    });

    const entities = detectEntities(text, watchlistText);
    if (entities.length > 0) score += 3;
    if (categories.length >= 2) score += 2;

    return { score, categories, matches, entities, sourceLabel };
  }

  function priority(score, categories) {
    const severe = [
      "Bankruptcy & Insolvency",
      "Credit Deterioration & Default",
      "Legal & Regulatory Issues",
      "Municipal & Public Finance Stress",
      "Healthcare / Hospital Stress"
    ];

    if (categories.includes("Bankruptcy & Insolvency")) return "High";
    if (categories.some(c => severe.includes(c)) && score >= 12) return "High";
    if (score >= 16) return "High";
    if (score >= 9) return "Medium";
    if (score >= 4) return "Low";
    if (score < 0) return "Positive / Monitor";
    return "Ignore";
  }

  function riskReason(row) {
    if (row.categories.includes("Bankruptcy & Insolvency")) return "Bankruptcy or insolvency language detected.";
    if (row.categories.includes("Credit Deterioration & Default")) return "Default, downgrade, covenant, liquidity, or payment stress detected.";
    if (row.categories.includes("Legal & Regulatory Issues")) return "Legal, enforcement, compliance, or investigation risk detected.";
    if (row.categories.includes("Municipal & Public Finance Stress")) return "Budget, reserves, debt service, or municipal credit stress detected.";
    if (row.categories.includes("Healthcare / Hospital Stress")) return "Hospital liquidity, operations, or reimbursement pressure detected.";
    if (row.categories.includes("Corporate Actions")) return "Asset sale, divestiture, acquisition, or strategic transaction detected.";
    if (row.categories.includes("Financing & Debt Activity")) return "Debt, refinancing, credit agreement, or funding activity detected.";
    if (row.categories.includes("Operational Risk Indicators")) return "Operational disruption, closures, layoffs, or cyber risk detected.";
    if (row.categories.includes("Positive Credit Signals")) return "Possible positive credit signal.";
    return "Potentially relevant for credit review.";
  }

  function normalizeTokens(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/group 1 automotive/g, "group1")
      .replace(/lithia uk/g, "lithiauk")
      .replace(/jaguar land rover/g, "jlr")
      .replace(/acquires?|acquired|acquisition/g, "acquire")
      .replace(/sells?|sold|sale|dispose|divestiture/g, "sell")
      .replace(/dealerships?/g, "dealer")
      .replace(/sites?/g, "site")
      .replace(/[^a-z0-9\s]/g, " ")
      .split(/\s+/)
      .filter(Boolean)
      .filter(t => t.length > 2)
      .filter(t => !["the","and","for","with","from","into","over","here","are","all","this","that","has","have","will","its","inc","news","group"].includes(t));
  }

  function articleEventKey(row) {
    const text = [row.title, row.excerpt, row.entities.join(" ")].join(" ");
    const tokens = normalizeTokens(text);

    const importantTokens = [];
    const mustKeep = ["group1","lithiauk","jlr","ftc","deceptive","pricing","lawsuit","investigation","sell","acquire","dealer","site","asset","divestiture","regulatory","default","bankruptcy","liquidity","downgrade"];

    mustKeep.forEach(t => {
      if (tokens.includes(t)) importantTokens.push(t);
    });

    tokens.forEach(t => {
      if (!importantTokens.includes(t) && importantTokens.length < 8) importantTokens.push(t);
    });

    return importantTokens.slice(0, 8).sort().join("|");
  }

  function dedupeGrouped(rows) {
    const groups = {};

    rows.forEach(row => {
      const key = articleEventKey(row) || (row.title + "|" + row.domain + "|" + row.priority);
      if (!groups[key]) {
        groups[key] = {
          id: row.id,
          priority: row.priority,
          score: row.score,
          title: row.title,
          entities: row.entities.slice(),
          categories: row.categories.slice(),
          matches: JSON.parse(JSON.stringify(row.matches)),
          sourceLabel: row.sourceLabel,
          reason: row.reason,
          url: row.url,
          domain: row.domain,
          excerpt: row.excerpt,
          raw: row.raw,
          sourceCount: 1,
          sourceType: row.sourceType,
          origin: row.origin
        };
      } else {
        const g = groups[key];
        g.score = Math.max(g.score, row.score);
        g.sourceCount += 1;

        if (row.title.length > g.title.length) g.title = row.title;
        if (row.excerpt.length > g.excerpt.length) g.excerpt = row.excerpt;
        if (!g.url && row.url) g.url = row.url;
        if (!g.domain && row.domain) g.domain = row.domain;

        g.categories = Array.from(new Set(g.categories.concat(row.categories)));
        g.entities = Array.from(new Set(g.entities.concat(row.entities)));

        Object.keys(row.matches).forEach(cat => {
          if (!g.matches[cat]) g.matches[cat] = [];
          g.matches[cat] = Array.from(new Set(g.matches[cat].concat(row.matches[cat])));
        });
      }
    });

    return Object.values(groups).map(row => {
      row.priority = priority(row.score, row.categories);
      if (row.sourceCount > 1) {
        row.reason += " Duplicate story grouped (" + row.sourceCount + " sources).";
      }
      return row;
    });
  }

  function getAllInputChunks() {
    const chunks = [];

    const pasted = normalize(el.alertText.value);
    if (pasted) {
      chunks.push({
        sourceType: "pasted",
        sourceName: "Pasted text",
        title: "Pasted alert text",
        source: "Manual input",
        text: pasted,
        url: ""
      });
    }

    importedChunks.forEach(x => chunks.push(x));
    return chunks;
  }

  function analyzeAllInputs(watchlistText, minPriority, categoryFilter, query, sortBy) {
    const inputChunks = getAllInputChunks();
    const items = buildAnalysisItems(inputChunks);
    parsedChunkCount = items.length;

    const rows = items
      .filter(item => !isLowValueArticle(item))
      .map((item, idx) => {
        const scored = scoreArticle(item, watchlistText);
        const pri = priority(scored.score, scored.categories);

        return {
          id: idx + 1,
          priority: pri,
          score: scored.score,
          title: item.title,
          entities: scored.entities,
          categories: scored.categories,
          matches: scored.matches,
          sourceLabel: scored.sourceLabel,
          reason: riskReason({ categories: scored.categories }),
          url: item.url || "",
          domain: item.url ? domainFromUrl(item.url) : "",
          excerpt: item.snippet || excerpt(item.raw, 350),
          raw: item.raw,
          sourceType: item.rawMeta?.sourceType || item.kind,
          origin: item.rawMeta?.sourceName || item.source || "Imported source"
        };
      });

    let deduped = dedupeGrouped(rows)
      .filter(x => PRIORITY_RANK[x.priority] >= PRIORITY_RANK[minPriority])
      .filter(x => categoryFilter === "All categories" || x.categories.includes(categoryFilter));

    const q = String(query || "").toLowerCase().trim();
    if (q) {
      deduped = deduped.filter(r =>
        [
          r.title, r.excerpt, r.priority, r.reason,
          r.categories.join(" "), r.entities.join(" "),
          r.domain, JSON.stringify(r.matches), r.sourceType, r.origin
        ].join(" ").toLowerCase().includes(q)
      );
    }

    if (sortBy === "score") {
      deduped.sort((a, b) => b.score - a.score);
    } else if (sortBy === "title") {
      deduped.sort((a, b) => a.title.localeCompare(b.title));
    } else {
      deduped.sort((a, b) => (PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority]) || (b.score - a.score));
    }

    return deduped;
  }

  function badgeClass(priorityValue) {
    if (priorityValue === "High") return "priority-high";
    if (priorityValue === "Medium") return "priority-medium";
    if (priorityValue === "Low") return "priority-low";
    if (priorityValue === "Positive / Monitor") return "priority-positive";
    return "badge-neutral";
  }

  function renderResults(results) {
    el.shownCount.textContent = String(results.length);
    el.parsedCount.textContent = String(parsedChunkCount);

    if (!results.length) {
      el.results.innerHTML = '<div class="empty">No relevant credit items found.</div>';
      return;
    }

    el.results.innerHTML = results.map(r => {
      const chips = Object.keys(r.matches)
        .flatMap(cat => r.matches[cat].slice(0, 10).map(hit =>
          '<span class="chip" title="' + escapeHtml(cat) + '">' + escapeHtml(hit) + '</span>'
        ))
        .join("");

      const rawBlock = expandedRawId === r.id
        ? '<pre class="raw">' + escapeHtml(r.raw) + '</pre>'
        : '';

      const urlLink = r.url
        ? '<a href="' + escapeHtml(r.url) + '" target="_blank" rel="noreferrer">Open source</a>'
        : '';

      return '' +
        '<div class="result-card">' +
          '<div class="badges">' +
            '<span class="badge ' + badgeClass(r.priority) + '">' + escapeHtml(r.priority) + '</span>' +
            '<span class="badge badge-neutral">Score ' + r.score + '</span>' +
            '<span class="badge badge-neutral">' + escapeHtml(r.sourceLabel) + '</span>' +
            (r.domain ? '<span class="badge badge-neutral">' + escapeHtml(r.domain) + '</span>' : '') +
            (r.sourceType ? '<span class="badge badge-neutral">' + escapeHtml(r.sourceType) + '</span>' : '') +
          '</div>' +
          '<div class="title">' + escapeHtml(r.title) + '</div>' +
          '<div class="reason">' + escapeHtml(r.reason) + '</div>' +
          '<div class="excerpt">' + escapeHtml(r.excerpt) + '</div>' +
          '<div class="meta">' +
            '<div><strong>Entities:</strong> ' + (r.entities.length ? escapeHtml(r.entities.join(", ")) : "None") + '</div>' +
            '<div><strong>Categories:</strong> ' + (r.categories.length ? escapeHtml(r.categories.join(", ")) : "None") + '</div>' +
            '<div><strong>Origin:</strong> ' + escapeHtml(r.origin || "Unknown") + '</div>' +
            '<div><strong>Source type:</strong> ' + escapeHtml(r.sourceType || "Unknown") + '</div>' +
          '</div>' +
          '<div class="chips">' + chips + '</div>' +
          '<div class="links">' +
            urlLink +
            ' <button data-raw-toggle="' + r.id + '">' + (expandedRawId === r.id ? 'Hide raw text' : 'Show raw text') + '</button>' +
          '</div>' +
          rawBlock +
        '</div>';
    }).join("");

    Array.from(el.results.querySelectorAll("[data-raw-toggle]")).forEach(btn => {
      btn.addEventListener("click", function () {
        const id = Number(this.getAttribute("data-raw-toggle"));
        expandedRawId = expandedRawId === id ? null : id;
        renderResults(lastResults);
      });
    });
  }

  function updateSummary(results) {
    const counts = {
      "High": 0,
      "Medium": 0,
      "Low": 0,
      "Positive / Monitor": 0
    };

    results.forEach(r => {
      if (counts[r.priority] !== undefined) counts[r.priority]++;
    });

    el.countHigh.textContent = String(counts["High"]);
    el.countMedium.textContent = String(counts["Medium"]);
    el.countLow.textContent = String(counts["Low"]);
    el.countPositive.textContent = String(counts["Positive / Monitor"]);
  }

  function renderSourceList() {
    if (!importedChunks.length) {
      el.sourceList.innerHTML = '<div class="small">No files imported yet.</div>';
      return;
    }

    el.sourceList.innerHTML = importedChunks.map((chunk, idx) => {
      return (
        '<div class="source-item">' +
          '<div class="source-title">' + escapeHtml(chunk.title || chunk.sourceName || ("Imported " + (idx + 1))) + '</div>' +
          '<div class="source-meta">' +
            escapeHtml(chunk.sourceType || "file") +
            (chunk.source ? ' • ' + escapeHtml(chunk.source) : '') +
            (chunk.metaDate ? ' • ' + escapeHtml(chunk.metaDate) : '') +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function runAnalysis() {
    try {
      setStatus("", "");
      lastResults = analyzeAllInputs(
        el.watchlistText.value,
        el.minPriority.value,
        el.categoryFilter.value,
        el.searchBox.value,
        el.sortBy.value
      );
      updateSummary(lastResults);
      renderResults(lastResults);
      setStatus(
        "Parsed " + parsedChunkCount + " item(s). Kept " + lastResults.length + " credit-relevant result(s).",
        "ok"
      );
    } catch (err) {
      console.error(err);
      setStatus("Analysis failed: " + err.message, "error");
    }
  }

  function populateSampleSelect() {
    if (!el.sampleSelect) return;
    el.sampleSelect.innerHTML = SAMPLE_LIBRARY
      .map((sample, idx) => `<option value="${idx}">${escapeHtml(sample.name)}</option>`)
      .join("");
  }

  function loadSelectedSample() {
    const idx = Number(el.sampleSelect ? el.sampleSelect.value : 0);
    const sample = SAMPLE_LIBRARY[idx] || SAMPLE_LIBRARY[0];
    el.watchlistText.value = sample.watchlist || "";
    el.alertText.value = sample.text || "";
    importedChunks = [];
    renderSourceList();
    setStatus("Loaded sample: " + sample.name, "ok");
    runAnalysis();
  }

  function toggleKeywordLibrary() {
    el.keywordLibraryWrap.style.display =
      el.keywordLibraryWrap.style.display === "none" ? "block" : "none";
  }

  function applyCustomKeywords() {
    try {
      const parsed = JSON.parse(el.keywordLibrary.value);

      Object.keys(parsed).forEach(cat => {
        if (!parsed[cat].terms || !Array.isArray(parsed[cat].terms)) {
          throw new Error('Category "' + cat + '" must have a terms array');
        }
      });

      Object.keys(KEYWORD_LIBRARY).forEach(k => delete KEYWORD_LIBRARY[k]);
      Object.assign(KEYWORD_LIBRARY, parsed);

      populateCategoryFilter();
      fillKeywordLibrary();
      setStatus("Keyword library updated.", "ok");
    } catch (err) {
      console.error(err);
      setStatus("Invalid keyword library JSON.", "error");
    }
  }

  function downloadFile(filename, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function toCsv(rows) {
    const headers = [
      "priority","score","reason","title","entities","categories",
      "matched_keywords","source_quality","origin","source_type","url","source_domain","excerpt"
    ];

    function esc(value) {
      return '"' + String(value == null ? "" : value).replace(/"/g, '""') + '"';
    }

    const lines = rows.map(r => [
      r.priority,
      r.score,
      r.reason,
      r.title,
      r.entities.join("; "),
      r.categories.join("; "),
      JSON.stringify(r.matches),
      r.sourceLabel,
      r.origin,
      r.sourceType,
      r.url,
      r.domain,
      r.excerpt
    ].map(esc).join(","));

    return [headers.join(",")].concat(lines).join("\n");
  }

  function toMarkdown(rows) {
    const counts = rows.reduce((acc, r) => {
      acc[r.priority] = (acc[r.priority] || 0) + 1;
      return acc;
    }, {});

    return `# Tyler Secor Intern Project

Generated: ${new Date().toLocaleString()}

## Summary
- High: ${counts["High"] || 0}
- Medium: ${counts["Medium"] || 0}
- Low: ${counts["Low"] || 0}
- Positive / Monitor: ${counts["Positive / Monitor"] || 0}

${rows.map((r, i) => `

## ${i + 1}. ${r.title}
Priority: ${r.priority}
Score: ${r.score}
Reason: ${r.reason}
Entities: ${r.entities.join(", ") || "None"}
Categories: ${r.categories.join(", ") || "None"}
Source Quality: ${r.sourceLabel}
Origin: ${r.origin || "Unknown"}
Source Type: ${r.sourceType || "Unknown"}
Source: ${r.domain || "Unknown"}
URL: ${r.url || "N/A"}

Matched Keywords:
${Object.entries(r.matches).map(([cat, hits]) => `- ${cat}: ${hits.join(", ")}`).join("\n") || "- None"}

Excerpt:
${r.excerpt}
`).join("\n")}`;
  }

  function downloadCsv() {
    if (!lastResults.length) {
      alert("Run an analysis first.");
      return;
    }
    downloadFile("credit_alert_results.csv", toCsv(lastResults), "text/csv;charset=utf-8;");
  }

  function downloadJson() {
    if (!lastResults.length) {
      alert("Run an analysis first.");
      return;
    }
    downloadFile("credit_alert_results.json", JSON.stringify(lastResults, null, 2), "application/json");
  }

  function downloadMarkdown() {
    if (!lastResults.length) {
      alert("Run an analysis first.");
      return;
    }
    downloadFile("credit_alert_report.md", toMarkdown(lastResults), "text/markdown;charset=utf-8;");
  }

  function clearAllInputs() {
    el.alertText.value = "";
    el.watchlistText.value = "";
    el.searchBox.value = "";
    el.minPriority.value = "Low";
    el.categoryFilter.value = "All categories";
    el.sortBy.value = "priority";
    el.fileInput.value = "";
    expandedRawId = null;
    lastResults = [];
    parsedChunkCount = 0;
    importedChunks = [];
    setStatus("", "");
    updateSummary([]);
    renderResults([]);
    renderSourceList();
    el.shownCount.textContent = "0";
    el.parsedCount.textContent = "0";
  }

  function populateCategoryFilter() {
    const categories = ["All categories"].concat(Object.keys(KEYWORD_LIBRARY));
    el.categoryFilter.innerHTML = categories
      .map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>')
      .join("");
    el.categoryFilter.value = "All categories";
  }

  function fillKeywordLibrary() {
    el.keywordLibrary.value = JSON.stringify(KEYWORD_LIBRARY, null, 2);
    const count = Object.values(KEYWORD_LIBRARY).reduce((sum, cat) => sum + cat.terms.length, 0);
    el.keywordCount.textContent = String(count);
  }

  async function extractTextFromPdf(arrayBuffer) {
    if (!window.pdfjsLib) throw new Error("PDF parser not loaded.");
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(" ");
      fullText += pageText + "\n\n";
    }

    return fullText.trim();
  }

  async function extractTextFromDocx(arrayBuffer) {
    if (!window.mammoth) throw new Error("DOCX parser not loaded.");
    const result = await mammoth.extractRawText({ arrayBuffer });
    return String(result.value || "").trim();
  }

  async function parseUploadedFile(file) {
    const name = file.name.toLowerCase();

    if (file.size > 20 * 1024 * 1024) {
      throw new Error(file.name + " is larger than 20MB.");
    }

    if (name.endsWith(".txt") || name.endsWith(".md") || name.endsWith(".log") || name.endsWith(".csv")) {
      return {
        chunks: [{
          sourceType: "local-file",
          sourceName: file.name,
          title: file.name,
          source: "Local upload",
          text: await file.text(),
          url: ""
        }]
      };
    }

    if (name.endsWith(".eml")) {
      const raw = await file.text();
      return parseEml(raw, file.name);
    }

    if (name.endsWith(".pdf")) {
      const buffer = await file.arrayBuffer();
      const text = await extractTextFromPdf(buffer);
      return {
        chunks: [{
          sourceType: "local-file",
          sourceName: file.name,
          title: file.name,
          source: "Local upload",
          text,
          url: ""
        }]
      };
    }

    if (name.endsWith(".docx")) {
      const buffer = await file.arrayBuffer();
      const text = await extractTextFromDocx(buffer);
      return {
        chunks: [{
          sourceType: "local-file",
          sourceName: file.name,
          title: file.name,
          source: "Local upload",
          text,
          url: ""
        }]
      };
    }

    throw new Error("Unsupported file type: " + file.name);
  }

  async function importFiles(files) {
    const list = Array.from(files || []);
    if (!list.length) return;

    setStatus("Reading files...", "ok");

    const newChunks = [];
    const errors = [];

    for (const file of list) {
      try {
        const parsed = await parseUploadedFile(file);
        const chunks = parsed.chunks || [];
        chunks.forEach(chunk => {
          if (chunk.text && chunk.text.trim()) {
            newChunks.push({
              ...chunk,
              text: chunk.text.trim()
            });
          }
        });

        if (!chunks.length) {
          errors.push(file.name + ": no readable text found.");
        }
      } catch (err) {
        console.error(err);
        errors.push(file.name + ": " + err.message);
      }
    }

    importedChunks = importedChunks.concat(newChunks);
    renderSourceList();

    if (errors.length && newChunks.length) {
      setStatus("Loaded " + newChunks.length + " chunk(s). Some files had issues: " + errors.join(" | "), "error");
    } else if (errors.length) {
      setStatus(errors.join(" | "), "error");
    } else {
      setStatus("Loaded " + newChunks.length + " chunk(s).", "ok");
    }

    runAnalysis();
  }

  function handleFileUpload(event) {
    importFiles(event.target.files);
  }

  function setupDragDrop() {
    if (!el.uploadBox) return;

    ["dragenter", "dragover"].forEach(eventName => {
      el.uploadBox.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
        el.uploadBox.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(eventName => {
      el.uploadBox.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
        el.uploadBox.classList.remove("dragover");
      });
    });

    el.uploadBox.addEventListener("drop", e => {
      const files = e.dataTransfer.files;
      importFiles(files);
    });
  }

  el.btnAnalyzeTop.addEventListener("click", runAnalysis);
  el.btnAnalyzeSide.addEventListener("click", runAnalysis);
  el.btnRefresh.addEventListener("click", runAnalysis);
  el.btnExportCsv.addEventListener("click", downloadCsv);
  el.btnExportJson.addEventListener("click", downloadJson);
  el.btnExportMarkdown.addEventListener("click", downloadMarkdown);
  el.btnKeywordToggle.addEventListener("click", toggleKeywordLibrary);
  el.btnApplyKeywords.addEventListener("click", applyCustomKeywords);
  el.btnClear.addEventListener("click", clearAllInputs);
  el.btnLoadSample.addEventListener("click", loadSelectedSample);

  el.fileInput.addEventListener("change", handleFileUpload);
  el.searchBox.addEventListener("input", runAnalysis);
  el.sortBy.addEventListener("change", runAnalysis);
  el.minPriority.addEventListener("change", runAnalysis);
  el.categoryFilter.addEventListener("change", runAnalysis);

  setupDragDrop();
  populateCategoryFilter();
  populateSampleSelect();
  fillKeywordLibrary();
  updateSummary([]);
  renderSourceList();
  setStatus("Ready.", "ok");
}
</script>
