<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Alert Risk Filter</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#d1d5db;
      --primary:#0f172a;
      --primary-2:#1d4ed8;
      --high-bg:#fee2e2;
      --high-text:#991b1b;
      --med-bg:#ffedd5;
      --med-text:#9a3412;
      --low-bg:#fef3c7;
      --low-text:#92400e;
      --pos-bg:#dcfce7;
      --pos-text:#166534;
      --chip:#e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 34px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn:hover {
      opacity: 0.92;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 22px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .field textarea,
    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }

    .field textarea {
      resize: vertical;
      min-height: 120px;
    }

    .upload-box {
      border: 2px dashed var(--line);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: #fafafa;
    }

    .upload-box input {
      margin-top: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 12px;
    }

    .toolbar-left h2 {
      margin: 0 0 5px 0;
      font-size: 24px;
    }

    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar-right input,
    .toolbar-right select {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      background: white;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .priority-high {
      background: var(--high-bg);
      color: var(--high-text);
      border-color: #fecaca;
    }

    .priority-medium {
      background: var(--med-bg);
      color: var(--med-text);
      border-color: #fed7aa;
    }

    .priority-low {
      background: var(--low-bg);
      color: var(--low-text);
      border-color: #fde68a;
    }

    .priority-positive {
      background: var(--pos-bg);
      color: var(--pos-text);
      border-color: #bbf7d0;
    }

    .badge-neutral {
      background: #f3f4f6;
      color: #374151;
      border-color: #e5e7eb;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      line-height: 1.3;
    }

    .reason {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .excerpt {
      color: #475569;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .chip {
      background: var(--chip);
      color: #374151;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
    }

    .links a, .links button {
      color: var(--primary-2);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
    }

    pre.raw {
      background: #0f172a;
      color: #e5e7eb;
      padding: 12px;
      border-radius: 12px;
