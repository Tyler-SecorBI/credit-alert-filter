<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  const PRIORITY_RANK = {
    "High": 4,
    "Medium": 3,
    "Low": 2,
    "Positive / Monitor": 1,
    "Ignore": 0
  };

  const GOOGLE_NOISE_PATTERNS = [
    /manage your alerts/i,
    /unsubscribe/i,
    /google alerts/i,
    /see more results/i,
    /edit this alert/i,
    /you have received this email/i,
    /rss feed/i,
    /flag as irrelevant/i,
    /view all your alerts/i,
    /send feedback/i,
    /facebook/i,
    /twitter/i,
    /external email/i,
    /CAUTION:/i,
    /do not click links/i,
    /contact the .* help desk/i
  ];

  const SOURCE_NOISE_PATTERNS = [
    /investing\.com/i,
    /benzinga/i
  ];

  const LOW_VALUE_PATTERNS = [
    /people also watch/i,
    /compare against competitors/i,
    /summary table/i,
    /corporate event calendar/i,
    /price total return/i,
    /net income to common/i,
    /stock price/i,
    /quote/i
  ];

  const SOURCE_WEIGHTS = [
    { pattern: /sec\.gov|ftc\.gov|doj\.gov|emma\.msrb\.org|moodys|fitchratings|spglobal|krollbondratings|kbra/i, boost: 4, label: "Primary / regulatory / rating source" },
    { pattern: /reuters|bloomberg|wsj|ft\.com|apnews|prnewswire|businesswire|globenewswire/i, boost: 2, label: "Financial/newswire source" }
  ];

  const KEYWORD_LIBRARY = {
    "Bankruptcy & Insolvency": {
      severity: 10,
      terms: [
        "bankruptcy","filed for bankruptcy","chapter 7","chapter 11","chapter 13","insolvency","insolvent",
        "liquidation","receivership","restructuring","debt restructuring","financial distress",
        "debtor-in-possession","dip financing","out-of-court restructuring","moratorium on payments"
      ]
    },
    "Credit Deterioration & Default": {
      severity: 9,
      terms: [
        "default","payment default","missed payment","past due","delinquent","loan default",
        "covenant breach","technical default","rating downgrade","credit downgrade","negative outlook",
        "credit watch","creditwatch","distressed exchange","collections action","write-off","charge-off",
        "increased leverage","liquidity pressures","financial weakness","refinancing risk","bond default",
        "going concern warning","liquidity shortfall","cash flow problems"
      ]
    },
    "Corporate Actions": {
      severity: 5,
      terms: [
        "merger","acquisition","m&a","takeover","buyout","asset sale","divestiture","sale of business",
        "spin-off","spinoff","carve-out","ownership change","change in control","strategic alternatives",
        "exploring sale","stake sale","majority acquisition","minority investment"
      ]
    },
    "Legal & Regulatory Issues": {
      severity: 7,
      terms: [
        "lawsuit","litigation","legal action","class action","court ruling","judgment","settlement",
        "regulatory investigation","sec investigation","ftc","doj investigation","enforcement action",
        "penalty","fine imposed","compliance violation","fraud allegations","accounting fraud",
        "financial restatement","material weakness","subpoena","criminal charges","civil charges",
        "license revoked","permit revoked","cease and desist order","antitrust investigation","indictment"
      ]
    },
    "Financial Performance Warning Signs": {
      severity: 7,
      terms: [
        "earnings miss","revenue decline","profit decline","net loss","operating loss","negative ebitda",
        "margin compression","declining sales","weak outlook","reduced guidance","lowered forecast",
        "declining cash flow","cash burn","liquidity concerns","weak demand","lower volumes",
        "negative free cash flow","poor financial results","declining profitability","financial strain"
      ]
    },
    "Financing & Debt Activity": {
      severity: 6,
      terms: [
        "bond issuance","loan refinancing","refinancing delay","credit facility","revolver drawdown",
        "debt repayment","debt buyback","debt restructuring","increased borrowing","leverage ratio",
        "covenant amendment","waiver granted","loan amendment","bridge loan","emergency funding",
        "capital raise","equity issuance","private placement","convertible debt","capital injection",
        "funding shortfall","lender negotiations","funding crisis","debt maturity extension",
        "credit agreement","revolving credit facility","term loan b","new loan facility"
      ]
    },
    "Operational Risk Indicators": {
      severity: 6,
      terms: [
        "plant closure","factory shutdown","layoffs","workforce reduction","job cuts","furloughs","strike",
        "labor dispute","supply chain disruption","production halt","operational disruption",
        "system outage","cyberattack","data breach","business interruption","facility damage",
        "major recall","product defect","quality issue","store closures","facility closures",
        "shutdown announcement","business shutdown","closing operations","mass layoffs","headcount reduction"
      ]
    },
    "Ownership & Insider Activity": {
      severity: 5,
      terms: [
        "insider buying","insider selling","insider sale","executive stock sale","director sold shares",
        "officer sold shares","form 4 filing","beneficial ownership filing","change in ownership",
        "change of control","shareholder dilution","ownership transferred","proxy contest"
      ]
    },
    "Tender Offers, Notes, Bonds & Capital Markets": {
      severity: 6,
      terms: [
        "tender offer","exchange offer","debt tender offer","bond tender offer","senior notes",
        "senior secured notes","senior unsecured notes","subordinated notes","convertible notes",
        "corporate bonds","notes offering","debt exchange offer","debt repurchase","tender for notes",
        "bondholder negotiations","missed coupon payment","default on bonds","debt maturity wall"
      ]
    },
    "Executive & Officer Changes": {
      severity: 5,
      terms: [
        "ceo resignation","ceo departure","ceo replaced","cfo resignation","executive turnover",
        "management shakeup","board changes","director resignation","interim ceo","sudden executive exit",
        "leadership uncertainty","executive misconduct","change in major officers","officer resignation"
      ]
    },
    "Large Projects & Capital Risk": {
      severity: 5,
      terms: [
        "major project announced","large capital project","project financing","construction delay","cost overruns",
        "project delay","budget overrun","funding gap","project halted","project cancellation",
        "capex spike","capex reduction","construction risk","execution risk","over budget","regulatory delay"
      ]
    },
    "Share Repurchases & Equity Actions": {
      severity: 4,
      terms: [
        "share repurchase","stock buyback","repurchase program","buyback suspension","equity issuance",
        "stock offering","secondary offering","dilution risk","capital raise","rights offering",
        "dividend suspension","dividend cut","share dilution","delisting risk","trading halt"
      ]
    },
    "Positive Credit Signals": {
      severity: -3,
      terms: [
        "rating upgraded","credit upgrade","positive outlook","debt reduction","deleveraging","record revenue",
        "strong liquidity","improved margins","budget surplus","grant awarded","contract awarded","new funding",
        "capital investment","refinanced debt","improved financial position","debt paid down","strong cash flow"
      ]
    }
  };

  let lastResults = [];
  let parsedChunkCount = 0;
  let expandedRawId = null;

  function setStatus(message = "", type = "") {
    const box = document.getElementById("statusBox");
    if (!box) return;
    box.className = "status";
    box.textContent = "";
    if (!message) return;
    box.textContent = message;
    box.classList.add(type === "error" ? "error" : "ok");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function normalize(text) {
    return String(text || "")
      .replace(/&amp;/g, "&")
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function stripHtml(text) {
    return String(text || "")
      .replace(/<style[\s\S]*?<\/style>/gi, " ")
      .replace(/<script[\s\S]*?<\/script>/gi, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/gi, " ")
      .replace(/&amp;/gi, "&")
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/\s+/g, " ")
      .trim();
  }

  function cleanEmailText(text) {
    let t = String(text || "");

    // quoted-printable cleanup
    t = t.replace(/=\r?\n/g, "");
    t = t.replace(/=3D/g, "=");

    // strip common email headers
    t = t.replace(/^(From|To|Cc|Bcc|Subject|Date|Reply-To|Return-Path|Received|MIME-Version|Content-Type|Content-Transfer-Encoding):.*$/gim, "");

    // strip html if present
    t = stripHtml(t);

    // remove alert noise line-by-line
    t = t.split("\n").filter(line => {
      const l = line.trim();
      if (!l) return true;
      return !GOOGLE_NOISE_PATTERNS.some(p => p.test(l));
    }).join("\n");

    return normalize(t);
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function termRegex(term) {
    const escaped = escapeRegExp(String(term).trim());
    return new RegExp("(^|[^a-zA-Z0-9])" + escaped + "([^a-zA-Z0-9]|$)", "i");
  }

  function extractUrls(text) {
    return text.match(/https?:\/\/[^\s)\]}>\"']+/g) || [];
  }

  function domainFromUrl(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch {
      return "";
    }
  }

  function titleGuess(text) {
    const lines = text.split("\n").map(x => x.trim()).filter(Boolean);
    const line = lines.find(l => !/^https?:\/\//i.test(l) && l.length > 10) || lines[0] || "Untitled alert item";
    return line.slice(0, 190);
  }

  function excerpt(text, n = 420) {
    const clean = text.replace(/\s+/g, " ").trim();
    return clean.length <= n ? clean : clean.slice(0, n).replace(/\s+\S*$/, "") + "...";
  }

  function detectEntities(text, watchlistText) {
    const lower = text.toLowerCase();
    const entities = [];

    String(watchlistText || "")
      .split(/\n|,|;/)
      .map(x => x.trim())
      .filter(Boolean)
      .forEach(entity => {
        if (lower.includes(entity.toLowerCase())) entities.push(entity);
      });

    const patterns = [
      /\bCity of [A-Z][A-Za-z .'-]+/g,
      /\bTown of [A-Z][A-Za-z .'-]+/g,
      /\bVillage of [A-Z][A-Za-z .'-]+/g,
      /\b[A-Z][A-Za-z .'-]+ County\b/g,
      /\b[A-Z][A-Za-z .'-]+ School District\b/g,
      /\b[A-Z][A-Za-z .'-]+ Water Authority\b/g,
      /\b[A-Z][A-Za-z .'-]+ Utility District\b/g,
      /\b[A-Z][A-Za-z .'-]+ Hospital\b/g,
      /\b[A-Z][A-Za-z .'-]+ Medical Center\b/g,
      /\b[A-Z][A-Za-z .'-]+ Authority\b/g,
      /\b[A-Z][A-Za-z .'-]+ Cooperative\b/g,
      /\bGroup 1 Automotive\b/gi,
      /\bLithia UK\b/gi
    ];

    patterns.forEach(p => {
      const matches = text.match(p) || [];
      matches.forEach(x => entities.push(x.trim().replace(/[.,;:]$/, "")));
    });

    return [...new Set(entities.map(x => x.trim()))];
  }

  function extractGoogleAlertArticles(rawText) {
    const text = cleanEmailText(rawText);
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

    const articles = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      // pattern: "Title - Source https://url"
      const hasUrl = /https?:\/\//i.test(line);
      const titleLike = line.length > 20;

      if (hasUrl && titleLike) {
        const urlMatch = line.match(/https?:\/\/\S+/i);
        const url = urlMatch ? urlMatch[0] : "";
        const titlePart = line.replace(url, "").trim();

        let source = "";
        let snippet = "";
        let j = i + 1;

        if (j < lines.length && lines[j].length < 120) {
          source = lines[j];
          j++;
        }

        while (j < lines.length) {
          const next = lines[j];
          if (/https?:\/\//i.test(next) && next.length > 20) break;
          if (GOOGLE_NOISE_PATTERNS.some(p => p.test(next))) break;
          snippet += (snippet ? " " : "") + next;
          j++;
          if (snippet.length > 500) break;
        }

        articles.push({
          title: titlePart,
          source,
          snippet: snippet.trim(),
          url,
          raw: [titlePart, source, snippet, url].filter(Boolean).join("\n")
        });

        i = j;
        continue;
      }

      i++;
    }

    // fallback if parser misses structure
    if (!articles.length) {
      const chunks = text.split(/\n\s*\n/).map(x => x.trim()).filter(x => x.length > 80);
      chunks.forEach(chunk => {
        const urls = extractUrls(chunk);
        if (urls.length) {
          articles.push({
            title: titleGuess(chunk),
            source: "",
            snippet: excerpt(chunk, 280),
            url: urls[0],
            raw: chunk
          });
        }
      });
    }

    return articles;
  }

  function isLowValueArticle(article) {
    const combined = [article.title, article.source, article.snippet].join(" ").toLowerCase();

    if (GOOGLE_NOISE_PATTERNS.some(p => p.test(combined))) return true;
    if (LOW_VALUE_PATTERNS.some(p => p.test(combined))) return true;

    // suppress low-value finance table/calendar pages unless they also hit real credit terms
    if (SOURCE_NOISE_PATTERNS.some(p => p.test(article.source)) || SOURCE_NOISE_PATTERNS.some(p => p.test(article.url))) {
      const hasRealCreditSignal =
        /(lawsuit|investigation|fraud|subpoena|default|bankruptcy|liquidity|downgrade|layoffs|closure|asset sale|divestiture|acquisition|debt|refinancing|credit facility|ftc|doj|sec)/i
          .test(combined);
      if (!hasRealCreditSignal) return true;
    }

    return false;
  }

  function scoreArticle(article, watchlistText) {
    const text = [article.title, article.source, article.snippet].join(" ");
    let score = 0;
    const categories = [];
    const matches = {};

    Object.entries(KEYWORD_LIBRARY).forEach(([category, config]) => {
      const hits = [];
      config.terms.forEach(term => {
        if (termRegex(term).test(text)) hits.push(term);
      });

      if (hits.length) {
        categories.push(category);
        matches[category] = [...new Set(hits)];
        score += Number(config.severity || 5) + Math.min(hits.length, 6);
      }
    });

    const domain = article.url ? domainFromUrl(article.url) : "";
    let sourceLabel = article.source || domain || "Standard source";

    SOURCE_WEIGHTS.forEach(src => {
      if (src.pattern.test(domain) || src.pattern.test(article.source) || src.pattern.test(text)) {
        score += src.boost;
        sourceLabel = src.label;
      }
    });

    const entities = detectEntities(text, watchlistText);
    if (entities.length > 0) score += 3;
    if (categories.length >= 2) score += 2;

    return { score, categories, matches, entities, sourceLabel };
  }

  function priority(score, categories) {
    const severe = [
      "Bankruptcy & Insolvency",
      "Credit Deterioration & Default",
      "Legal & Regulatory Issues"
    ];

    if (categories.includes("Bankruptcy & Insolvency")) return "High";
    if (categories.some(c => severe.includes(c)) && score >= 12) return "High";
    if (score >= 16) return "High";
    if (score >= 9) return "Medium";
    if (score >= 4) return "Low";
    if (score < 0) return "Positive / Monitor";
    return "Ignore";
  }

  function riskReason(row) {
    if (row.categories.includes("Bankruptcy & Insolvency")) return "Bankruptcy or insolvency language detected.";
    if (row.categories.includes("Credit Deterioration & Default")) return "Default, downgrade, covenant, liquidity, or payment stress detected.";
    if (row.categories.includes("Legal & Regulatory Issues")) return "Legal, FTC/DOJ/SEC, compliance, or investigation risk detected.";
    if (row.categories.includes("Corporate Actions")) return "Asset sale, divestiture, acquisition, or strategic transaction detected.";
    if (row.categories.includes("Financing & Debt Activity")) return "Debt, refinancing, credit agreement, or funding activity detected.";
    if (row.categories.includes("Operational Risk Indicators")) return "Operational disruption, closures, layoffs, or cyber risk detected.";
    if (row.categories.includes("Positive Credit Signals")) return "Possible positive credit signal.";
    return "Potentially relevant for credit review.";
  }

  function normalizeTokens(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/group 1 automotive/g, "group1")
      .replace(/lithia uk/g, "lithiauk")
      .replace(/jaguar land rover/g, "jlr")
      .replace(/acquires?|acquired|acquisition/g, "acquire")
      .replace(/sells?|sold|sale|dispose|disposed|divestiture/g, "sell")
      .replace(/dealerships?/g, "dealer")
      .replace(/sites?/g, "site")
      .replace(/[^a-z0-9\s]/g, " ")
      .split(/\s+/)
      .filter(Boolean)
      .filter(t => t.length > 2)
      .filter(t => !["the","and","for","with","from","into","over","here","are","all","this","that","has","have","will","its","inc","news","group"].includes(t));
  }

  function articleEventKey(row) {
    const text = [row.title, row.excerpt, row.entities.join(" ")].join(" ");
    const tokens = normalizeTokens(text);

    const importantTokens = [];
    const mustKeep = ["group1","lithiauk","jlr","ftc","deceptive","pricing","lawsuit","investigation","sell","acquire","dealer","site","asset","divestiture","regulatory"];
    mustKeep.forEach(t => {
      if (tokens.includes(t)) importantTokens.push(t);
    });

    // fallback tokens
    tokens.forEach(t => {
      if (!importantTokens.includes(t) && importantTokens.length < 6) importantTokens.push(t);
    });

    return importantTokens.slice(0, 6).sort().join("|");
  }

  function dedupeGrouped(rows) {
    const groups = {};

    rows.forEach(row => {
      const key = articleEventKey(row);
      if (!groups[key]) {
        groups[key] = { ...row, sourceCount: 1, sourceDomains: row.domain ? [row.domain] : [] };
      } else {
        groups[key].score = Math.max(groups[key].score, row.score);
        groups[key].sourceCount += 1;
        if (row.domain && !groups[key].sourceDomains.includes(row.domain)) {
          groups[key].sourceDomains.push(row.domain);
        }

        // keep richer title/snippet if longer
        if (row.title.length > groups[key].title.length) groups[key].title = row.title;
        if (row.excerpt.length > groups[key].excerpt.length) groups[key].excerpt = row.excerpt;

        // merge matches/categories/entities
        groups[key].categories = [...new Set([...groups[key].categories, ...row.categories])];
        groups[key].entities = [...new Set([...groups[key].entities, ...row.entities])];

        Object.entries(row.matches).forEach(([cat, hits]) => {
          if (!groups[key].matches[cat]) groups[key].matches[cat] = [];
          groups[key].matches[cat] = [...new Set([...groups[key].matches[cat], ...hits])];
        });

        // prefer a more meaningful source url if current one is empty
        if (!groups[key].url && row.url) groups[key].url = row.url;
        if (!groups[key].domain && row.domain) groups[key].domain = row.domain;
      }
    });

    const deduped = Object.values(groups).map(row => {
      if (row.sourceCount > 1) {
        row.reason += ` Duplicate story grouped (${row.sourceCount} sources).`;
      }
      row.priority = priority(row.score, row.categories);
      return row;
    });

    return deduped;
  }

  function analyze(rawText, watchlistText, minPriority, categoryFilter, query, sortBy) {
    const articles = extractGoogleAlertArticles(rawText);
    parsedChunkCount = articles.length;

    const rows = articles
      .filter(article => !isLowValueArticle(article))
      .map((article, idx) => {
        const scored = scoreArticle(article, watchlistText);
        const pri = priority(scored.score, scored.categories);

        const row = {
          id: idx + 1,
          priority: pri,
          score: scored.score,
          title: article.title,
          entities: scored.entities,
          categories: scored.categories,
          matches: scored.matches,
          sourceLabel: scored.sourceLabel,
          reason: "",
          url: article.url || "",
          domain: article.url ? domainFromUrl(article.url) : "",
          excerpt: article.snippet || excerpt(article.raw),
          raw: article.raw || [article.title, article.source, article.snippet, article.url].filter(Boolean).join("\n")
        };

        row.reason = riskReason(row);
        return row;
      });

    let deduped = dedupeGrouped(rows)
      .filter(x => PRIORITY_RANK[x.priority] >= PRIORITY_RANK[minPriority])
      .filter(x => categoryFilter === "All categories" || x.categories.includes(categoryFilter));

    const q = String(query || "").toLowerCase().trim();
    if (q) {
      deduped = deduped.filter(r =>
        [
          r.title, r.excerpt, r.priority, r.reason,
          r.categories.join(" "), r.entities.join(" "),
          r.domain, JSON.stringify(r.matches)
        ].join(" ").toLowerCase().includes(q)
      );
    }

    if (sortBy === "score") {
      deduped.sort((a, b) => b.score - a.score);
    } else if (sortBy === "title") {
      deduped.sort((a, b) => a.title.localeCompare(b.title));
    } else {
      deduped.sort((a, b) =>
        PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority] || b.score - a.score
      );
    }

    return deduped;
  }

  function badgeClass(priority) {
    if (priority === "High") return "priority-high";
    if (priority === "Medium") return "priority-medium";
    if (priority === "Low") return "priority-low";
    if (priority === "Positive / Monitor") return "priority-positive";
    return "badge-neutral";
  }

  function renderResults(results) {
    const resultsEl = document.getElementById("results");
    document.getElementById("shownCount").textContent = results.length;
    document.getElementById("parsedCount").textContent = parsedChunkCount;

    if (!results.length) {
      resultsEl.innerHTML = `<div class="empty">No relevant credit items found.</div>`;
      return;
    }

    resultsEl.innerHTML = results.map(r => {
      const chips = Object.entries(r.matches)
        .flatMap(([cat, hits]) =>
          hits.slice(0, 10).map(hit =>
            `<span class="chip" title="${escapeHtml(cat)}">${escapeHtml(hit)}</span>`
          )
        )
        .join("");

      const rawBlock = expandedRawId === r.id
        ? `<pre class="raw">${escapeHtml(r.raw)}</pre>`
        : "";

      const urlLink = r.url
        ? `<a href="${escapeHtml(r.url)}" target="_blank" rel="noreferrerrn `
        <div class="result-card">
          <div class="badges">
            <span class="badge ${badgeClass(r.priority)}">${escapeHtml(r.priority)}</span>
            <span class="badge badge-neutral">Score ${r.score}</span>
            <span class="badge badge-neutral">${escapeHtml(r.sourceLabel)}</span>
            ${r.domain ? `<span class="badge badge-neutral">${escapeHtml(r.domain)}</span>` : ""}
          </div>

          <div class="title">${escapeHtml(r.title)}</div>
          <div class="reason">${escapeHtml(r.reason)}</div>
          <div class="excerpt">${escapeHtml(r.excerpt)}</div>

          <div class="meta">
            <div><strong>Entities:</strong> ${r.entities.length ? escapeHtml(r.entities.join(", ")) : "None"}</div>
            <div><strong>Categories:</strong> ${r.categories.length ? escapeHtml(r.categories.join(", ")) : "None"}</div>
          </div>

          <div class="chips">${chips}</div>

          <div class="links">
            ${urlLink}
            <button onclick="toggleRaw(${r.id})">${expandedRawId === r.id ? "Hide raw text" : "Show raw text"}</button>
          </div>

          ${rawBlock}
        </div>
      `;
    }).join("");
  }

  function updateSummary(results) {
    const counts = {
      "High": 0,
      "Medium": 0,
      "Low": 0,
      "Positive / Monitor": 0
    };

    results.forEach(r => {
      if (counts[r.priority] !== undefined) counts[r.priority]++;
    });

    if (document.getElementById("countHigh")) document.getElementById("countHigh").textContent = counts["High"];
    if (document.getElementById("countMedium")) document.getElementById("countMedium").textContent = counts["Medium"];
    if (document.getElementById("countLow")) document.getElementById("countLow").textContent = counts["Low"];
    if (document.getElementById("countPositive")) document.getElementById("countPositive").textContent = counts["Positive / Monitor"];
  }

  function runAnalysis() {
    try {
      setStatus("", "");
      const alertText = document.getElementById("alertText").value;
      const watchlistText = document.getElementById("watchlistText").value;
      const minPriority = document.getElementById("minPriority").value;
      const categoryFilter = document.getElementById("categoryFilter").value;
      const query = document.getElementById("searchBox").value;
      const sortBy = document.getElementById("sortBy").value;

      lastResults = analyze(alertText, watchlistText, minPriority, categoryFilter, query, sortBy);
      updateSummary(lastResults);
      renderResults(lastResults);
    } catch (err) {
      console.error(err);
      setStatus("Analysis failed: " + err.message, "error");
    }
  }

  function toggleRaw(id) {
    expandedRawId = expandedRawId === id ? null : id;
    renderResults(lastResults);
  }

  function toggleKeywordLibrary() {
    const wrap = document.getElementById("keywordLibraryWrap");
    wrap.style.display = wrap.style.display === "none" ? "block" : "none";
  }

  function applyCustomKeywords() {
    try {
      const raw = document.getElementById("keywordLibrary").value;
      const parsed = JSON.parse(raw);

      Object.keys(parsed).forEach(cat => {
        if (!parsed[cat].terms || !Array.isArray(parsed[cat].terms)) {
          throw new Error(`Category "${cat}" must have a terms array`);
        }
      });

      Object.keys(KEYWORD_LIBRARY).forEach(k => delete KEYWORD_LIBRARY[k]);
      Object.assign(KEYWORD_LIBRARY, parsed);

      populateCategoryFilter();
      fillKeywordLibrary();
      setStatus("Keyword library updated.", "ok");
    } catch (err) {
      console.error(err);
      setStatus("Invalid keyword library JSON.", "error");
    }
  }

  function downloadFile(filename, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function toCsv(rows) {
    const headers = [
      "priority","score","reason","title","entities","categories",
      "matched_keywords","source_quality","url","source_domain","excerpt"
    ];

    const esc = value => `"${String(value ?? "").replace(/"/g, '""')}"`;

    return [
      headers.join(","),
      ...rows.map(r =>
        [
          r.priority,
          r.score,
          r.reason,
          r.title,
          r.entities.join("; "),
          r.categories.join("; "),
          JSON.stringify(r.matches),
          r.sourceLabel,
          r.url,
          r.domain,
          r.excerpt
        ].map(esc).join(",")
      )
    ].join("\n");
  }

  function toMarkdown(rows) {
    const counts = rows.reduce((acc, r) => {
      acc[r.priority] = (acc[r.priority] || 0) + 1;
      return acc;
    }, {});

    return `# Tyler Secor Intern Project

Generated: ${new Date().toLocaleString()}

## Summary
- High: ${counts["High"] || 0}
- Medium: ${counts["Medium"] || 0}
- Low: ${counts["Low"] || 0}
- Positive / Monitor: ${counts["Positive / Monitor"] || 0}

${rows.map((r, i) => `

## ${i + 1}. ${r.title}
Priority: ${r.priority}
Score: ${r.score}
Reason: ${r.reason}
Entities: ${r.entities.join(", ") || "None"}
Categories: ${r.categories.join(", ") || "None"}
Source Quality: ${r.sourceLabel}
Source: ${r.domain || "Unknown"}
URL: ${r.url || "N/A"}

Matched Keywords:
${Object.entries(r.matches).map(([cat, hits]) => `- ${cat}: ${hits.join(", ")}`).join("\n") || "- None"}

Excerpt:
${r.excerpt}
`).join("\n")}`;
  }

  function downloadCsv() {
    if (!lastResults.length) return alert("Run an analysis first.");
    downloadFile("credit_alert_results.csv", toCsv(lastResults), "text/csv;charset=utf-8;");
  }

  function downloadJson() {
    if (!lastResults.length) return alert("Run an analysis first.");
    downloadFile("credit_alert_results.json", JSON.stringify(lastResults, null, 2), "application/json");
  }

  function downloadMarkdown() {
    if (!lastResults.length) return alert("Run an analysis first.");
    downloadFile("credit_alert_report.md", toMarkdown(lastResults), "text/markdown;charset=utf-8;");
  }

  function clearAllInputs() {
    document.getElementById("alertText").value = "";
    document.getElementById("watchlistText").value = "";
    document.getElementById("searchBox").value = "";
    document.getElementById("minPriority").value = "Low";
    document.getElementById("categoryFilter").value = "All categories";
    document.getElementById("sortBy").value = "priority";
    document.getElementById("fileInput").value = "";
    expandedRawId = null;
    lastResults = [];
    parsedChunkCount = 0;
    setStatus("");
    updateSummary([]);
    renderResults([]);
    document.getElementById("shownCount").textContent = "0";
    document.getElementById("parsedCount").textContent = "0";
  }

  function populateCategoryFilter() {
    const select = document.getElementById("categoryFilter");
    if (!select) return;
    const categories = ["All categories", ...Object.keys(KEYWORD_LIBRARY)];
    select.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    select.value = "All categories";
  }

  function fillKeywordLibrary() {
    const box = document.getElementById("keywordLibrary");
    if (box) box.value = JSON.stringify(KEYWORD_LIBRARY, null, 2);

    const count = Object.values(KEYWORD_LIBRARY).reduce((sum, cat) => sum + cat.terms.length, 0);
    if (document.getElementById("keywordCount")) document.getElementById("keywordCount").textContent = count;
  }

  async function extractTextFromPdf(arrayBuffer) {
    if (!window.pdfjsLib) throw new Error("PDF parser not loaded.");
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(" ");
      fullText += pageText + "\n\n";
    }

    return fullText.trim();
  }

  async function extractTextFromDocx(arrayBuffer) {
    if (!window.mammoth) throw new Error("DOCX parser not loaded.");
    const result = await mammoth.extractRawText({ arrayBuffer });
    return String(result.value || "").trim();
  }

  async function parseUploadedFile(file) {
    const name = file.name.toLowerCase();

    if (file.size > 15 * 1024 * 1024) {
      throw new Error(`${file.name} is larger than 15MB.`);
    }

    if (name.endsWith(".txt") || name.endsWith(".md") || name.endsWith(".log") || name.endsWith(".csv")) {
      return await file.text();
    }

    if (name.endsWith(".eml")) {
      const text = await file.text();
      return cleanEmailText(text);
    }

    if (name.endsWith(".pdf")) {
      const buffer = await file.arrayBuffer();
      return await extractTextFromPdf(buffer);
    }

    if (name.endsWith(".docx")) {
      const buffer = await file.arrayBuffer();
      return await extractTextFromDocx(buffer);
    }

    throw new Error(`Unsupported file type: ${file.name}`);
  }

  async function handleFileUpload(event) {
    const files = Array.from(event.target.files || []);
    if (!files.length) return;

    setStatus("Reading files...", "ok");

    const chunks = [];
    const errors = [];

    for (const file of files) {
      try {
        const text = await parseUploadedFile(file);
        if (text && text.trim()) {
          chunks.push(text.trim());
        } else {
          errors.push(`${file.name}: no readable text found.`);
        }
      } catch (err) {
        console.error(err);
        errors.push(`${file.name}: ${err.message}`);
      }
    }

    const current = document.getElementById("alertText").value;
    const combined = [current, ...chunks].filter(Boolean).join("\n\n");
    document.getElementById("alertText").value = combined;

    if (errors.length && chunks.length) {
      setStatus(`Loaded ${chunks.length} file(s). Some files had issues: ${errors.join(" | ")}`, "error");
    } else if (errors.length) {
      setStatus(errors.join(" | "), "error");
    } else {
      setStatus(`Loaded ${chunks.length} file(s).`, "ok");
    }
  }

  // Hook up UI
  document.getElementById("fileInput").addEventListener("change", handleFileUpload);
  document.getElementById("searchBox").addEventListener("input", runAnalysis);
  document.getElementById("sortBy").addEventListener("change", runAnalysis);
  document.getElementById("minPriority").addEventListener("change", runAnalysis);
  document.getElementById("categoryFilter").addEventListener("change", runAnalysis);

  populateCategoryFilter();
  fillKeywordLibrary();
  updateSummary([]);
</script>
