<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyler Secor Intern Project</title>

  <!-- External libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

  <style>
    :root{
      --bg:#f6f8f6;
      --card:#ffffff;
      --text:#13211a;
      --muted:#5b675f;
      --line:#d6ddd7;
      --primary:#1f4d3b;
      --primary-dark:#17392c;
      --accent:#c59b3a;
      --high-bg:#fde8e8;
      --high-text:#9b1c1c;
      --med-bg:#fff1df;
      --med-text:#9b5312;
      --low-bg:#fff7d6;
      --low-text:#8a5a00;
      --pos-bg:#e5f6ea;
      --pos-text:#166534;
      --chip:#e9eeea;
      --error-bg:#fff1f2;
      --error-text:#9f1239;
      --ok-bg:#eefdf3;
      --ok-text:#166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f9fbf9 0%, #f3f6f4 100%);
      color: var(--text);
    }

    .container {
      max-width: 1460px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, #245844 55%, #2c6750 100%);
      color: white;
      border-radius: 24px;
      padding: 24px 28px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(24, 57, 44, 0.18);
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 34px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: rgba(255,255,255,0.88);
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .btn {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn.gold {
      background: var(--accent);
      color: #2f2410;
      border: 1px solid #b98f31;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 15px rgba(20, 34, 28, 0.04);
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 6px 15px rgba(20, 34, 28, 0.04);
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 21px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .field textarea,
    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      color: var(--text);
    }

    .field textarea {
      resize: vertical;
      min-height: 130px;
    }

    .upload-box {
      border: 2px dashed #b7c4bb;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: #edf5f1;
      color: var(--text);
    }

    .small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .status {
      display: none;
      margin-bottom: 14px;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .status.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #fecdd3;
    }

    .status.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid #bbf7d0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 12px;
    }

    .toolbar-left h2 {
      margin: 0 0 5px 0;
      font-size: 24px;
    }

    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar-right input,
    .toolbar-right select {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      background: white;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .priority-high {
      background: var(--high-bg);
      color: var(--high-text);
      border-color: #f8caca;
    }

    .priority-medium {
      background: var(--med-bg);
      color: var(--med-text);
      border-color: #ffd9ac;
    }

    .priority-low {
      background: var(--low-bg);
      color: var(--low-text);
      border-color: #f7e28a;
    }

    .priority-positive {
      background: var(--pos-bg);
      color: var(--pos-text);
      border-color: #bce8c8;
    }

    .badge-neutral {
      background: #f3f5f4;
      color: #374151;
      border-color: #e6ebe8;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      line-height: 1.3;
    }

    .reason {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    .excerpt {
      color: #46574d;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .chip {
      background: var(--chip);
      color: #33413a;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .links a, .links button {
      color: #1a5fb4;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      font: inherit;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fafcfa;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .meta {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar-right {
        width: 100%;
      }
      .toolbar-right input,
      .toolbar-right select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Tyler Secor Intern Project</h1>
      <div class="subtitle">Credit Alert Risk Filter</div>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="top-actions">
      <button class="btn" id="btnAnalyzeTop" type="button">Analyze</button>
      <button class="btn" id="btnExportCsv" type="button">Export CSV</button>
      <button class="btn" id="btnExportJson" type="button">Export JSON</button>
      <button class="btn" id="btnExportMarkdown" type="button">Export Report</button>
      <button class="btn secondary" id="btnKeywordToggle" type="button">Keyword Library</button>
      <button class="btn gold" id="btnLoadSample" type="button">Load Sample</button>
      <button class="btn secondary" id="btnClear" type="button">Clear</button>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">High</div>
        <div class="summary-value" id="countHigh">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Medium</div>
        <div class="summary-value" id="countMedium">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Low</div>
        <div class="summary-value" id="countLow">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Positive / Monitor</div>
        <div class="summary-value" id="countPositive">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Keywords</div>
        <div class="summary-value" id="keywordCount">0</div>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>Inputs</h2>

        <div class="field">
          <label>Upload files</label>
          <div class="upload-box">
            <input type="file" id="fileInput" multiple accept=".txt,.eml,.md,.log,.csv,.pdf,.docx,.msg" />
          </div>
          <div class="small">.txt, .eml, .md, .log, .csv, .pdf, .docx, .msg</div>
        </div>

        <div class="field">
          <label for="alertText">Alert text</label>
          <textarea id="alertText" placeholder="Paste Gmail or Google Alert text here"></textarea>
        </div>

        <div class="field">
          <label for="watchlistText">Watchlist</label>
          <textarea id="watchlistText" placeholder="One company, municipality, owner, or alias per line"></textarea>
        </div>

        <div class="field">
          <label for="minPriority">Minimum priority</label>
          <select id="minPriority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low" selected>Low</option>
            <option value="Positive / Monitor">Positive / Monitor</option>
            <option value="Ignore">Ignore</option>
          </select>
        </div>

        <div class="field">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter"></select>
        </div>

        <div class="field">
          <button class="btn" id="btnAnalyzeSide" type="button" style="width:100%;">Analyze</button>
        </div>

        <div class="field" id="keywordLibraryWrap" style="display:none;">
          <label>Keyword library (editable JSON)</label>
          <textarea id="keywordLibrary" style="min-height:320px;"></textarea>
          <button class="btn secondary" id="btnApplyKeywords" type="button" style="margin-top:8px;">Apply Keyword Changes</button>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div class="toolbar-left">
            <h2>Results</h2>
            <div class="small">
              <span id="shownCount">0</span> shown • <span id="parsedCount">0</span> article blocks parsed
            </div>
          </div>
          <div class="toolbar-right">
            <input id="searchBox" type="text" placeholder="Search" />
            <select id="sortBy">
              <option value="priority">Priority</option>
              <option value="score">Score</option>
              <option value="title">Title</option>
            </select>
            <button class="btn secondary" id="btnRefresh" type="button">Refresh</button>
          </div>
        </div>

        <div id="results" class="result-list">
          <div class="empty">Upload or paste alert text, then click Analyze.</div>
        </div>
      </div>
    </div>

    <div class="footer-note">Tyler Secor Intern Project</div>
  </div>

  <script>
    window.addEventListener("load", () => {
      try {
        initApp();
      } catch (err) {
        console.error(err);
        const box = document.getElementById("statusBox");
        box.className = "status error";
        box.textContent = "Startup error: " + err.message;
      }
    });

    function initApp() {
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }

      const PRIORITY_RANK = {
        "High": 4,
        "Medium": 3,
        "Low": 2,
        "Positive / Monitor": 1,
        "Ignore": 0
      };

      const GOOGLE_NOISE_PATTERNS = [
        /manage your alerts/i,
        /unsubscribe/i,
        /google alerts/i,
        /see more results/i,
        /edit this alert/i,
        /you have received this email/i,
        /rss feed/i,
        /flag as irrelevant/i,
        /view all your alerts/i,
        /send feedback/i,
        /facebook/i,
        /twitter/i,
        /external email/i,
        /caution:/i,
        /do not click links/i,
        /contact the .* help desk/i
      ];

      const LOW_VALUE_PATTERNS = [
        /people also watch/i,
        /compare against competitors/i,
        /summary table/i,
        /corporate event calendar/i,
        /price total return/i,
        /net income to common/i,
        /stock price/i,
        /quote/i
      ];

      const KEYWORD_LIBRARY = buildExpandedKeywordLibrary();

      let lastResults = [];
      let parsedChunkCount = 0;

      const el = {
        statusBox: document.getElementById("statusBox"),
        alertText: document.getElementById("alertText"),
        watchlistText: document.getElementById("watchlistText"),
        minPriority: document.getElementById("minPriority"),
        categoryFilter: document.getElementById("categoryFilter"),
        searchBox: document.getElementById("searchBox"),
        sortBy: document.getElementById("sortBy"),
        results: document.getElementById("results"),
        shownCount: document.getElementById("shownCount"),
        parsedCount: document.getElementById("parsedCount"),
        countHigh: document.getElementById("countHigh"),
        countMedium: document.getElementById("countMedium"),
        countLow: document.getElementById("countLow"),
        countPositive: document.getElementById("countPositive"),
        keywordCount: document.getElementById("keywordCount"),
        keywordLibraryWrap: document.getElementById("keywordLibraryWrap"),
        keywordLibrary: document.getElementById("keywordLibrary"),
        fileInput: document.getElementById("fileInput"),
        btnAnalyzeTop: document.getElementById("btnAnalyzeTop"),
        btnAnalyzeSide: document.getElementById("btnAnalyzeSide"),
        btnRefresh: document.getElementById("btnRefresh"),
        btnExportCsv: document.getElementById("btnExportCsv"),
        btnExportJson: document.getElementById("btnExportJson"),
        btnExportMarkdown: document.getElementById("btnExportMarkdown"),
        btnKeywordToggle: document.getElementById("btnKeywordToggle"),
        btnApplyKeywords: document.getElementById("btnApplyKeywords"),
        btnClear: document.getElementById("btnClear"),
        btnLoadSample: document.getElementById("btnLoadSample")
      };

      function setStatus(message, type = "ok") {
        if (!message) {
          el.statusBox.className = "status";
          el.statusBox.textContent = "";
          return;
        }
        el.statusBox.className = "status " + (type === "error" ? "error" : "ok");
        el.statusBox.textContent = message;
      }

      function normalize(text) {
        return String(text || "")
          .replace(/\r/g, "\n")
          .replace(/[ \t]+/g, " ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function stripHtml(text) {
        return String(text || "")
          .replace(/<style[\s\S]*?<\/style>/gi, "\n")
          .replace(/<script[\s\S]*?<\/script>/gi, "\n")
          .replace(/<br\s*\/?>/gi, "\n")
          .replace(/<\/p>/gi, "\n")
          .replace(/<\/div>/gi, "\n")
          .replace(/<\/tr>/gi, "\n")
          .replace(/<\/table>/gi, "\n")
          .replace(/<\/td>/gi, " ")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/gi, " ")
          .replace(/&amp;/gi, "&")
          .replace(/&quot;/gi, '"')
          .replace(/&#39;/gi, "'")
          .replace(/\n{3,}/g, "\n\n")
          .replace(/[ \t]+/g, " ")
          .trim();
      }

      function cleanEmailText(text) {
        let t = String(text || "");
        t = t.replace(/=\r?\n/g, "");   // quoted-printable soft line breaks
        t = t.replace(/=3D/g, "=");
        t = stripHtml(t);
        t = t
          .split("\n")
          .map(line => line.trim())
          .filter(line => line && !GOOGLE_NOISE_PATTERNS.some(p => p.test(line)))
          .join("\n");
        return normalize(t);
      }

      function extractUrls(text) {
        return text.match(/https?:\/\/[^\s)\]}>\"']+/g) || [];
      }

      function domainFromUrl(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return "";
        }
      }

      function excerpt(text, n = 420) {
        const clean = String(text || "").replace(/\s+/g, " ").trim();
        return clean.length <= n ? clean : clean.slice(0, n).replace(/\s+\S*$/, "") + "...";
      }

      function detectEntities(text, watchlistText) {
        const lower = text.toLowerCase();
        const entities = [];
        String(watchlistText || "")
          .split(/\n|,|;/)
          .map(x => x.trim())
          .filter(Boolean)
          .forEach(entity => {
            if (lower.includes(entity.toLowerCase())) entities.push(entity);
          });
        return Array.from(new Set(entities));
      }

      function extractArticleBlocks(rawText) {
        const text = cleanEmailText(rawText);
        const blocks = text.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
        const out = [];

        for (const block of blocks) {
          const lower = block.toLowerCase();
          if (GOOGLE_NOISE_PATTERNS.some(p => p.test(lower))) continue;
          if (LOW_VALUE_PATTERNS.some(p => p.test(lower))) continue;

          const urls = extractUrls(block);
          if (!urls.length) continue;

          const lines = block.split("\n").map(x => x.trim()).filter(Boolean);
          const title = lines[0] || "Untitled";
          const source = lines[1] || "";
          const summary = lines.slice(2).join(" ") || block;

          out.push({
            title,
            source,
            excerpt: excerpt(summary, 380),
            url: urls[0],
            raw: block
          });
        }
        return out;
      }

      function scoreArticle(article, watchlist) {
        const text = `${article.title} ${article.source} ${article.excerpt}`.toLowerCase();
        let score = 0;
        const categories = [];
        const matches = {};

        Object.entries(KEYWORD_LIBRARY).forEach(([cat, cfg]) => {
          const hits = cfg.terms.filter(term => text.includes(term.toLowerCase()));
          if (hits.length) {
            categories.push(cat);
            matches[cat] = hits.slice(0, 15);
            score += cfg.severity + Math.min(hits.length, 6);
          }
        });

        const entities = detectEntities(text, watchlist);
        if (entities.length) score += 2;

        let priority = "Ignore";
        if (categories.includes("Bankruptcy & Insolvency")) priority = "High";
        else if (score >= 14) priority = "High";
        else if (score >= 8) priority = "Medium";
        else if (score >= 3) priority = "Low";
        else if (score < 0) priority = "Positive / Monitor";

        return { priority, score, categories, matches, entities };
      }

      function reasonFor(categories) {
        if (categories.includes("Bankruptcy & Insolvency")) return "Bankruptcy or insolvency language detected.";
        if (categories.includes("Credit Deterioration & Default")) return "Default, covenant, downgrade, or liquidity stress detected.";
        if (categories.includes("Legal & Regulatory Issues")) return "Legal, regulatory, SEC/FTC/DOJ, or investigation risk detected.";
        if (categories.includes("Corporate Actions")) return "Asset sale, divestiture, acquisition, or strategic transaction detected.";
        if (categories.includes("Financing & Debt Activity")) return "Debt, refinancing, capital raise, or credit facility activity detected.";
        if (categories.includes("Operational Risk Indicators")) return "Layoffs, closures, shutdowns, or cyber/operational risk detected.";
        if (categories.includes("Positive Credit Signals")) return "Possible positive credit signal.";
        return "Potentially relevant for credit review.";
      }

      function analyze() {
        try {
          const minPriority = el.minPriority.value;
          const search = el.searchBox.value.toLowerCase().trim();
          const categoryFilter = el.categoryFilter.value;
          const watchlist = el.watchlistText.value;

          let articles = extractArticleBlocks(el.alertText.value);
          parsedChunkCount = articles.length;

          let results = articles.map(a => {
            const scored = scoreArticle(a, watchlist);
            return {
              ...a,
              ...scored,
              domain: domainFromUrl(a.url),
              reason: reasonFor(scored.categories)
            };
          });

          results = results.filter(r => PRIORITY_RANK[r.priority] >= PRIORITY_RANK[minPriority]);

          if (categoryFilter !== "All categories") {
            results = results.filter(r => r.categories.includes(categoryFilter));
          }

          if (search) {
            results = results.filter(r =>
              `${r.title} ${r.excerpt} ${r.reason} ${r.categories.join(" ")} ${r.entities.join(" ")}`
                .toLowerCase()
                .includes(search)
            );
          }

          if (el.sortBy.value === "score") {
            results.sort((a, b) => b.score - a.score);
          } else if (el.sortBy.value === "title") {
            results.sort((a, b) => a.title.localeCompare(b.title));
          } else {
            results.sort((a, b) => (PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority]) || (b.score - a.score));
          }

          lastResults = results;
          renderResults(results);
          updateSummary(results);

          setStatus(`Parsed ${parsedChunkCount} article block(s). Kept ${results.length} credit-relevant item(s).`, "ok");
        } catch (err) {
          console.error(err);
          setStatus("Analysis failed: " + err.message, "error");
        }
      }

      function renderResults(results) {
        el.shownCount.textContent = String(results.length);
        el.parsedCount.textContent = String(parsedChunkCount);

        if (!results.length) {
          el.results.innerHTML = '<div class="empty">No relevant credit items found.</div>';
          return;
        }

        el.results.innerHTML = results.map(r => {
          const chips = Object.entries(r.matches)
            .flatMap(([cat, hits]) => hits.map(hit => `<span class="chip" title="${escapeHtml(cat)}">${escapeHtml(hit)}</span>`))
            .join("");

          return `
            <div class="result-card">
              <div class="badges">

      function downloadFile(filename, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

          r.score,
          r.title,
          r.entities.join("; "),

        const csv = [headers.join(",")]
          .concat(rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")))
          .join("\n");
        downloadFile("credit_alert_results.csv", csv, "text/csv;charset=utf-8;");

      async function decodeTextFile(file) {
        const buffer = await file.arrayBuffer();

        // try UTF-8 first
        try {
          const text = new TextDecoder("utf-8", { fatal: false }).decode(buffer);
          if (looksLikeReadableText(text)) return text;
        } catch {}

        // fallback windows-1252
        try {
          const text = new TextDecoder("windows-1252", { fatal: false }).decode(buffer);
          if (looksLikeReadableText(text)) return text;
        } catch {}

        // final fallback
        const text = new TextDecoder().decode(buffer);
        return text;
      }

      function looksLikeReadableText(text) {
        if (!text) return false;
        const sample = text.slice(0, 4000);
        const controlChars = (sample.match(/[\x00-\x08\x0E-\x1F]/g) || []).length;
        return controlChars < sample.length * 0.02;
      }

      async function extractTextFromPdf(arrayBuffer) {
        if (!window.pdfjsLib) throw new Error("PDF parser not loaded.");
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(x => x.str).join(" ") + "\n\n";
        }
        return fullText.trim();
      }

      async function extractTextFromDocx(arrayBuffer) {
        if (!window.mammoth) throw new Error("DOCX parser not loaded.");
        const result = await mammoth.extractRawText({ arrayBuffer });
        return String(result.value || "").trim();
      }

      async function parseUploadedFile(file) {
        const lower = file.name.toLowerCase();

        if (lower.endsWith(".msg")) {
          throw new Error("MSG files are not supported in-browser. Please save the email as .eml or paste the text instead.");
        }

        if (lower.endsWith(".txt") || lower.endsWith(".md") || lower.endsWith(".log") || lower.endsWith(".csv")) {
          return normalize(await decodeTextFile(file));
        }

        if (lower.endsWith(".eml")) {
          return cleanEmailText(await decodeTextFile(file));
        }

        if (lower.endsWith(".pdf")) {
          return await extractTextFromPdf(await file.arrayBuffer());
        }

        if (lower.endsWith(".docx")) {
          return await extractTextFromDocx(await file.arrayBuffer());
        }

        throw new Error("Unsupported file type: " + file.name);
      }

      async function handleFileUpload(event) {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;

        setStatus("Reading files...", "ok");

        const chunks = [];
        const errors = [];

        for (const file of files) {
          try {
            const text = await parseUploadedFile(file);
            if (text && text.trim()) {
              chunks.push(text.trim());
            } else {
              errors.push(`${file.name}: no readable text found.`);
            }
          } catch (err) {
            console.error(err);
            errors.push(`${file.name}: ${err.message}`);
          }
        }

        el.alertText.value = [el.alertText.value, ...chunks].filter(Boolean).join("\n\n");

        if (errors.length && chunks.length) {
          setStatus(`Loaded ${chunks.length} file(s). Some files had issues: ${errors.join(" | ")}`, "error");
        } else if (errors.length) {
          setStatus(errors.join(" | "), "error");
        } else {
          setStatus(`Loaded ${chunks.length} file(s).`, "ok");
        }
      }
